<%-
	-- Praefix tauschen, sobald die Domain-Auswahl wechselt; Regel wie
	-- neanderfunk.default_hostname.swap_prefix. Nur bei der Ersteinrichtung
	-- eingebunden (wizard/0210-neanderfunk-hostname-prefix).
	local data = require('jsonc').stringify(self.prefixes):gsub('<', '\\u003c')
-%>
<script>
(function () {
	var prefixes = <%=data%>;
	var host = document.querySelector('input[name$=".hostname"]');
	if (!host || !host.form) {
		return;
	}

	function swap(name, now) {
		var best = '';
		for (var code in prefixes) {
			var p = prefixes[code];
			if (p.length > best.length && name.substr(0, p.length) === p) {
				best = p;
			}
		}
		return best === '' ? name : now + name.substr(best.length);
	}

	host.form.addEventListener('change', function (ev) {
		var t = ev.target;
		if (!t.name || !/\.domain$/.test(t.name) || !(t.value in prefixes)) {
			return;
		}
		var swapped = swap(host.value, prefixes[t.value]);
		if (swapped !== host.value) {
			host.value = swapped;
			// gluon-web prueft Eingaben bei keyup/blur neu
			host.dispatchEvent(new Event('keyup'));
		}
	});
})();
</script>
