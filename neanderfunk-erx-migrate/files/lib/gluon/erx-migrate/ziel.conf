# Ziel der Migration. Wird beim Bau des Zwischenimages gefuellt, nicht von Hand.
#
# Solange hier nichts steht, tut das Paket NICHTS - erx-migrate-run beendet
# sich still. Das ist Absicht: das Paket darf ausgeliefert werden, bevor die
# Daten feststehen.
#
# Warum die Pruefsumme hier eingebacken wird und nicht zur Laufzeit geholt:
# der Autoupdater taugt nicht als Downloader. Sein --no-action greift erst
# NACH "sysupgrade --test", und genau das scheitert bei der Migration
# (compat_version 1.x gegen 2.0) - die Datei ist dann schon geloescht. Die
# Pruefsumme reist also im Zwischenimage mit, das der Autoupdater signiert
# ausliefert. Damit haengt die ganze Kette am vorhandenen Vertrauensanker,
# ohne dass im Skript Kryptografie noetig waere.
#
# Je Geraet, weil ERX und ERX SFP verschiedene Images bekommen. Der Name des
# Boards steht in /tmp/sysinfo/board_name.

# ubnt,edgerouter-x
IMAGE_URL_ERX=""
IMAGE_SHA_ERX=""

# ubnt,edgerouter-x-sfp
IMAGE_URL_ERX_SFP=""
IMAGE_SHA_ERX_SFP=""

# Token fuer die Fehlerausgabe ueber HTTP:
#
#   http://[<knoten>]/cgi-bin/erx-migrate-log?t=<token>
#
# Leer = keine Ausgabe ueber HTTP, das CGI schweigt dann. Das Token gehoert
# nicht in den oeffentlichen Paketfeed, sondern in die site.conf, aus der diese
# Datei beim Bau gefuellt wird.
#
# Port 80 ist auf einem Gluon-Knoten aus mesh und loc_client ohnehin offen, die
# Statusseite liegt dort. Das Token schuetzt also nicht vor jemandem im Netz,
# sondern verhindert, dass ein Log unter einem geratenen Pfad herausfaellt.
LOG_TOKEN=""
