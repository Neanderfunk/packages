# Ziel der Migration: das Modell, nach dem erx-migrate-run im signierten
# Manifest des eigenen Autoupdater-Zweigs sucht. Version, Dateiname, Groesse und
# Pruefsumme kommen aus dieser Zeile, das Ziel laeuft also mit dem Zweig mit.
#
# Ohne Eintrag tut das Paket NICHTS - erx-migrate-run beendet sich still.
#
# Warum das Skript selbst laedt: der Autoupdater taugt nicht als Downloader.
# Sein --no-action greift erst NACH "sysupgrade --test", und genau das scheitert
# bei der Migration (compat_version 1.x gegen 2.0) - die Datei ist dann schon
# geloescht.
#
# Je Geraet, weil ERX und ERX SFP verschiedene Images bekommen. Der Name des
# Boards steht in /tmp/sysinfo/board_name.

# ubnt,edgerouter-x
ZIEL_MODELL_ERX="ubiquiti-edgerouter-x-ka"

# ubnt,edgerouter-x-sfp
ZIEL_MODELL_ERX_SFP="ubiquiti-edgerouter-x-sfp-ka"

# Token fuer die Fehlerausgabe ueber HTTP:
#
#   http://[<knoten>]/cgi-bin/erx-migrate-log?t=<token>
#
# Leer = keine Ausgabe ueber HTTP, das CGI schweigt dann. Das Token gehoert
# nicht in den oeffentlichen Paketfeed, es wird beim Bau eingetragen.
#
# Port 80 ist auf einem Gluon-Knoten aus mesh und loc_client ohnehin offen, die
# Statusseite liegt dort. Das Token schuetzt also nicht vor jemandem im Netz,
# sondern verhindert, dass ein Log unter einem geratenen Pfad herausfaellt.
LOG_TOKEN=""
