<div class="nf-section" id="<%=id%>" data-index="<%=self.index%>"<%= attr("data-depends", self:deplist()) %>>
	<% if self.title and #self.title > 0 then %><div class="subhead"><%|self.title%></div><% end %>
	<% if self.description and #self.description > 0 then %><div class="gdesc"><%=self.description%></div><% end %>
	<div class="nf-rows" id="section-<%=id%>"><% self:render_children(renderer, scope) %></div>
</div>
